name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-byggexp-api
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Gate: a failing test (money math, SIE, etc.) blocks the deploy.
      - name: Run tests
        run: npm test -- --ci

      - name: Build NestJS
        run: npm run build

      - name: Pack release
        run: |
          tar --exclude='./.git' \
              --exclude='./.github' \
              --exclude='./node_modules' \
              --exclude='./test' \
              -czf /tmp/release.tar.gz .
          mv /tmp/release.tar.gz ./release.tar.gz
          ls -lh release.tar.gz

      - name: Upload to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: release.tar.gz
          target: /tmp/

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEEPL_API_KEY,ANTHROPIC_API_KEY,INBOUND_INVOICE_TOKEN,SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASS,SMTP_FROM,STRIPE_SECRET_KEY,STRIPE_WEBHOOK_SECRET,STRIPE_PRICE_START_MONTHLY,STRIPE_PRICE_START_YEARLY,STRIPE_PRICE_TILLVAXT_MONTHLY,STRIPE_PRICE_TILLVAXT_YEARLY,STRIPE_PRICE_PROFESSIONELL_MONTHLY,STRIPE_PRICE_PROFESSIONELL_YEARLY,APP_PUBLIC_URL,BILLING_ENFORCED,STRIPE_TAX_ENABLED
          script: |
            set -euo pipefail
            RELEASE=$(date -u +%Y%m%d-%H%M%S)
            BASE=/opt/byggexp-api
            DIR=$BASE/releases/$RELEASE
            echo "==> New release: $DIR"

            mkdir -p "$DIR"
            tar -xzf /tmp/release.tar.gz -C "$DIR"
            rm -f /tmp/release.tar.gz

            # link shared resources (env + uploads)
            ln -sf "$BASE/shared/.env" "$DIR/.env"
            rm -rf "$DIR/uploads"
            ln -s "$BASE/shared/uploads" "$DIR/uploads"

            # Sync AI provider keys from GitHub Secrets into the shared env
            # (idempotent; empty secret = leave the file untouched).
            ENV_FILE="$BASE/shared/.env"
            touch "$ENV_FILE"
            upsert_env() {
              local k="$1" v="$2"
              [ -z "$v" ] && return 0
              if grep -q "^${k}=" "$ENV_FILE"; then
                sed -i "s|^${k}=.*|${k}=${v}|" "$ENV_FILE"
              else
                echo "${k}=${v}" >> "$ENV_FILE"
              fi
            }
            upsert_env DEEPL_API_KEY "${DEEPL_API_KEY:-}"
            upsert_env ANTHROPIC_API_KEY "${ANTHROPIC_API_KEY:-}"
            upsert_env INBOUND_INVOICE_TOKEN "${INBOUND_INVOICE_TOKEN:-}"
            upsert_env SMTP_HOST "${SMTP_HOST:-}"
            upsert_env SMTP_PORT "${SMTP_PORT:-}"
            upsert_env SMTP_USER "${SMTP_USER:-}"
            upsert_env SMTP_PASS "${SMTP_PASS:-}"
            upsert_env SMTP_FROM "${SMTP_FROM:-}"
            upsert_env STRIPE_SECRET_KEY "${STRIPE_SECRET_KEY:-}"
            upsert_env STRIPE_WEBHOOK_SECRET "${STRIPE_WEBHOOK_SECRET:-}"
            upsert_env STRIPE_PRICE_START_MONTHLY "${STRIPE_PRICE_START_MONTHLY:-}"
            upsert_env STRIPE_PRICE_START_YEARLY "${STRIPE_PRICE_START_YEARLY:-}"
            upsert_env STRIPE_PRICE_TILLVAXT_MONTHLY "${STRIPE_PRICE_TILLVAXT_MONTHLY:-}"
            upsert_env STRIPE_PRICE_TILLVAXT_YEARLY "${STRIPE_PRICE_TILLVAXT_YEARLY:-}"
            upsert_env STRIPE_PRICE_PROFESSIONELL_MONTHLY "${STRIPE_PRICE_PROFESSIONELL_MONTHLY:-}"
            upsert_env STRIPE_PRICE_PROFESSIONELL_YEARLY "${STRIPE_PRICE_PROFESSIONELL_YEARLY:-}"
            upsert_env APP_PUBLIC_URL "${APP_PUBLIC_URL:-}"
            upsert_env BILLING_ENFORCED "${BILLING_ENFORCED:-}"
            upsert_env STRIPE_TAX_ENABLED "${STRIPE_TAX_ENABLED:-}"

            cd "$DIR"
            echo "==> Installing production deps"
            export PUPPETEER_SKIP_DOWNLOAD=true
            npm ci --omit=dev --no-audit --no-fund

            # Remember what was running, so a failed release can be put back.
            # Without this the deploy could only fail loudly and leave the site down.
            PREV="$(readlink -f "$BASE/current" 2>/dev/null || true)"
            echo "==> Previous release: ${PREV:-none}"

            # atomic switch
            ln -sfn "$DIR" "$BASE/current"
            echo "==> Linked $BASE/current -> $DIR"

            # The variables exported by ssh-action have done their only job above:
            # they were written into the shared .env file. Keeping them exported is
            # what broke outgoing mail again and again.
            #
            # Why: pm2 start captures the current shell environment into the process,
            # and pm2 save freezes it into dump.pm2, which systemd replays with
            # pm2 resurrect after every reboot. A GitHub secret that is missing
            # arrives here as an empty string, so an empty SMTP_PASS gets frozen.
            # Node's --env-file does NOT override a variable that already exists,
            # and an empty string is a value, so a perfectly correct .env is
            # powerless against it. Proven on this host:
            #     X_PROBE= node --env-file=probe.env -e 'print X_PROBE'  ->  ""
            #
            # From here on the file is the single source of truth.
            unset DEEPL_API_KEY ANTHROPIC_API_KEY INBOUND_INVOICE_TOKEN
            unset SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS SMTP_FROM
            unset STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET
            unset STRIPE_PRICE_START_MONTHLY STRIPE_PRICE_START_YEARLY
            unset STRIPE_PRICE_TILLVAXT_MONTHLY STRIPE_PRICE_TILLVAXT_YEARLY
            unset STRIPE_PRICE_PROFESSIONELL_MONTHLY STRIPE_PRICE_PROFESSIONELL_YEARLY
            unset APP_PUBLIC_URL BILLING_ENFORCED STRIPE_TAX_ENABLED

            # Guard the invariant that actually broke, rather than trusting the unset
            # above to stay correct when someone adds a variable to the envs: list.
            for v in SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS SMTP_FROM; do
              if [ -n "${!v+isset}" ]; then
                echo "Refusing to start: $v is still exported and pm2 would freeze it into dump.pm2" >&2
                exit 1
              fi
            done

            # And check the file really carries the mail settings, so a deploy fails
            # loudly here instead of silently sending nothing in production.
            node --env-file="$ENV_FILE" -e '
              const missing = ["SMTP_HOST", "SMTP_PORT", "SMTP_USER", "SMTP_PASS", "SMTP_FROM"]
                .filter((k) => !process.env[k]);
              if (missing.length) {
                console.error("Empty after --env-file: " + missing.join(", "));
                process.exit(1);
              }
              console.log("Mail settings present in shared/.env");
            '

            # pm2 lives in /usr/local/bin, and the deploy user does NOT have that
            # directory on PATH in a non-interactive shell: there it is only
            # /sbin:/bin:/usr/sbin:/usr/bin. That is why the daemon could be started
            # from the systemd unit (which sets PATH explicitly) but not by hand.
            # Resolving the binary here removes the dependency on PATH entirely,
            # instead of patching PATH in one more dotfile that the next shell forgets.
            PM2="$(command -v pm2 || true)"
            [ -x "$PM2" ] || PM2=/usr/local/bin/pm2
            [ -x "$PM2" ] || { echo "pm2 not found, looked at PATH and /usr/local/bin" >&2; exit 1; }
            echo "==> Using pm2 at $PM2"

            cd "$BASE/current"
            echo "==> (Re)starting PM2"
            # startOrReload instead of delete+start: delete tears the process down and
            # leaves the port dead for the whole npm start-up, reload replaces it in
            # place. In fork mode this is a SHORT gap, not zero: honest zero-downtime
            # would need a second instance, and cluster mode is unsafe here because the
            # API registers scheduled jobs (ScheduleModule in app.module) which would
            # then fire twice. See RUNBOOK.md for what it would take to do properly.
            "$PM2" startOrReload ecosystem.config.js --update-env
            "$PM2" save

            echo "==> Health check"
            sleep 5
            HEALTHY=0
            for i in 1 2 3 4 5 6; do
              if curl -fsS -m 5 http://127.0.0.1:3001/ > /dev/null 2>&1; then
                echo "OK on attempt $i"
                HEALTHY=1
                break
              fi
              sleep 5
            done

            # Rollback. A deploy that fails its own health check must not be left
            # standing: the previous release is known good, so we put it back and only
            # then fail the job. Failing without rolling back would hand the client a
            # dead site and a red checkmark, which is strictly worse than either.
            if [ "$HEALTHY" != "1" ]; then
              echo "Health check failed" >&2
              "$PM2" logs byggexp-api --lines 50 --nostream || true
              if [ -n "${PREV:-}" ] && [ -d "$PREV" ]; then
                echo "==> Rolling back to $PREV" >&2
                ln -sfn "$PREV" "$BASE/current"
                cd "$BASE/current"
                "$PM2" startOrReload ecosystem.config.js --update-env || true
                "$PM2" save || true
                sleep 5
                if curl -fsS -m 5 http://127.0.0.1:3001/ > /dev/null 2>&1; then
                  echo "==> Rollback succeeded, previous release is serving again" >&2
                else
                  echo "==> ROLLBACK ALSO UNHEALTHY, manual action needed, see RUNBOOK.md" >&2
                fi
              else
                echo "==> No previous release to roll back to" >&2
              fi
              exit 1
            fi

            echo "==> Cleaning old releases (keep 5)"
            ls -1dt $BASE/releases/*/ 2>/dev/null | tail -n +6 | xargs -r rm -rf

            echo "==> Deploy successful: $RELEASE"
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INBOUND_INVOICE_TOKEN: ${{ secrets.INBOUND_INVOICE_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_START_MONTHLY: ${{ secrets.STRIPE_PRICE_START_MONTHLY }}
          STRIPE_PRICE_START_YEARLY: ${{ secrets.STRIPE_PRICE_START_YEARLY }}
          STRIPE_PRICE_TILLVAXT_MONTHLY: ${{ secrets.STRIPE_PRICE_TILLVAXT_MONTHLY }}
          STRIPE_PRICE_TILLVAXT_YEARLY: ${{ secrets.STRIPE_PRICE_TILLVAXT_YEARLY }}
          STRIPE_PRICE_PROFESSIONELL_MONTHLY: ${{ secrets.STRIPE_PRICE_PROFESSIONELL_MONTHLY }}
          STRIPE_PRICE_PROFESSIONELL_YEARLY: ${{ secrets.STRIPE_PRICE_PROFESSIONELL_YEARLY }}
          APP_PUBLIC_URL: ${{ secrets.APP_PUBLIC_URL }}
          BILLING_ENFORCED: ${{ secrets.BILLING_ENFORCED }}
          STRIPE_TAX_ENABLED: ${{ secrets.STRIPE_TAX_ENABLED }}
