name: CI

# Runs on every push and pull request so regressions are caught before they
# reach main / a deploy. The deploy workflow re-runs tests as a final gate.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    # MongoDB for the e2e suite (invite/auth flow, tenant isolation, company
    # onboarding). Each e2e spec uses its own throwaway DB on this instance.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run unit tests
        run: npm test -- --ci

      - name: Run e2e tests
        run: npm run test:e2e -- --ci --runInBand
        env:
          JWT_SECRET: e2e_test_secret

      - name: Build
        run: npm run build
